name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'v*-development'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin npm release toolchain
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm --version
      - run: npm ci --strict-allow-scripts
      - run: npm run build:check
      - run: npm test

  package:
    name: Package smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin npm release toolchain
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm --version
      - run: npm ci --strict-allow-scripts
      - run: npm run test:package

  browser:
    name: Browser on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin npm release toolchain
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm --version
      - run: npm ci --strict-allow-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - node
      - package
      - browser
    runs-on: ubuntu-latest

    steps:
      - name: Require all CI jobs to succeed
        env:
          NODE_RESULT: ${{ needs.node.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "node=$NODE_RESULT"
          echo "package=$PACKAGE_RESULT"
          echo "browser=$BROWSER_RESULT"
          test "$NODE_RESULT" = 'success'
          test "$PACKAGE_RESULT" = 'success'
          test "$BROWSER_RESULT" = 'success'
