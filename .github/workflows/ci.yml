name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'v*-development'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      browser_required: ${{ steps.classify.outputs.browser_required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Classify the complete PR diff
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-scope.js

  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin npm release toolchain
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm --version
      - run: npm ci --strict-allow-scripts
      - run: npm run build:check
      - run: npm test
      # Separate step on one runner: never overlap the concurrent Node suite.
      - name: Serial materialization phase coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:profile-coverage

  package:
    name: Package smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin npm release toolchain
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm --version
      - run: npm ci --strict-allow-scripts
      - run: npm run test:package

  browser:
    name: Browser on Ubuntu
    needs: scope
    if: ${{ needs.scope.outputs.browser_required != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin npm release toolchain
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm --version
      - run: npm ci --strict-allow-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        id: browser-tests
      - name: Upload navigation failure diagnostics
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-navigation-failures-${{ github.run_attempt }}
          path: output/playwright/browser-failures/
          if-no-files-found: warn
          retention-days: 7

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - scope
      - node
      - package
      - browser
    runs-on: ubuntu-latest

    steps:
      - name: Require expected CI jobs to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          BROWSER_REQUIRED: ${{ needs.scope.outputs.browser_required }}
          NODE_RESULT: ${{ needs.node.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE_RESULT mode=$SCOPE_MODE browser_required=$BROWSER_REQUIRED"
          echo "node=$NODE_RESULT"
          echo "package=$PACKAGE_RESULT"
          echo "browser=$BROWSER_RESULT"
          test "$SCOPE_RESULT" = 'success'
          test "$NODE_RESULT" = 'success'
          test "$PACKAGE_RESULT" = 'success'
          case "$BROWSER_REQUIRED" in
            true)
              test "$SCOPE_MODE" = 'full'
              test "$BROWSER_RESULT" = 'success'
              ;;
            false)
              test "$EVENT_NAME" = 'pull_request'
              test "$SCOPE_MODE" = 'docs-only'
              test "$BROWSER_RESULT" = 'skipped'
              ;;
            *) exit 1 ;;
          esac
