<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Session Analyzer</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-mobile-view="sessions">
    <header class="topbar">
      <div>
        <h1>Codex Session Analyzer</h1>
        <p id="stateLine">正在读取本地 sessions…</p>
      </div>
      <div class="searchbar">
        <div class="searchField">
          <input id="searchInput" type="search" placeholder="Search messages, commands, files, output" autocomplete="off" aria-controls="searchAssist" aria-expanded="false" aria-haspopup="dialog">
          <div id="searchAssist" class="searchAssist" role="dialog" aria-label="Search options" hidden>
            <div class="searchAssistSection">
              <div class="searchAssistTitle">Search filters</div>
              <div class="searchAssistControls">
                <label>
                  Kind
                  <select id="searchKindSelect" data-search-operator="kind">
                    <option value="">Any kind</option>
                    <option value="patch">Patch</option>
                    <option value="command">Command</option>
                    <option value="mcp">MCP</option>
                    <option value="web_search">Web search</option>
                    <option value="user_message">User message</option>
                    <option value="assistant_message">Assistant message</option>
                    <option value="plan_artifact">Plan</option>
                    <option value="error">Error</option>
                  </select>
                </label>
                <label>
                  Status
                  <select id="searchStatusSelect" data-search-operator="status">
                    <option value="">Any status</option>
                    <option value="failed">Failed</option>
                    <option value="success">Success</option>
                    <option value="completed">Completed</option>
                  </select>
                </label>
                <label>
                  Layer
                  <select id="searchLayerSelect" data-search-operator="layer">
                    <option value="">Current layer</option>
                    <option value="main">Main timeline</option>
                    <option value="protocol">Protocol layer</option>
                    <option value="raw">Raw records</option>
                  </select>
                </label>
                <label class="fileFilterControl">
                  File
                  <span class="fileSuggestControl">
                    <input id="searchFileInput" data-search-operator="file" placeholder="Any file" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="searchFileSuggestions">
                    <span id="searchFileSuggestions" class="searchFileSuggestions" role="listbox" hidden></span>
                  </span>
                </label>
              </div>
            </div>
            <div class="searchAssistSection">
              <div class="searchAssistTitle">Active</div>
              <div id="searchAssistChips" class="searchAssistChips"></div>
            </div>
          </div>
        </div>
        <select id="layerSelect" aria-label="事件层">
          <option value="main">Main timeline</option>
          <option value="protocol">Protocol layer</option>
          <option value="raw">Raw records</option>
        </select>
        <select id="profileSelect" aria-label="折叠策略"></select>
      </div>
    </header>

    <nav class="mobileViewTabs" aria-label="Narrow screen sections">
      <button class="mobileViewTab active" type="button" data-mobile-view="sessions">Sessions</button>
      <button class="mobileViewTab" type="button" data-mobile-view="events">Events</button>
      <button class="mobileViewTab" type="button" data-mobile-view="detail">Detail</button>
    </nav>

    <main class="layout">
      <aside class="sessionsPane">
        <section class="filters" aria-label="筛选器">
          <label>
            类型
            <select id="kindFilter">
              <option value="">全部</option>
              <option value="user_message">用户消息</option>
              <option value="assistant_message">助手消息</option>
              <option value="command">命令</option>
              <option value="patch">Patch</option>
              <option value="mcp">MCP</option>
              <option value="js_repl">JS REPL</option>
              <option value="tool_operation">Tool op</option>
              <option value="plan_artifact">Plan</option>
              <option value="protocol">Protocol</option>
              <option value="error">错误</option>
              <option value="compaction">压缩</option>
            </select>
          </label>
          <label>
            状态
            <select id="statusFilter">
              <option value="">全部</option>
              <option value="failed">失败</option>
              <option value="success">成功</option>
            </select>
          </label>
          <label>
            排序
            <select id="sortSelect">
              <option value="updated-desc">最近更新</option>
              <option value="started-asc">开始时间</option>
              <option value="events-desc">事件最多</option>
              <option value="failures-desc">失败最多</option>
            </select>
          </label>
        </section>
        <div id="sessionList" class="sessionList"></div>
      </aside>

      <section class="timelinePane">
        <div id="sessionHeader" class="sessionHeader">
          <h2>选择一个 session</h2>
          <p>左侧列表按当前仓库过滤。</p>
        </div>
        <div class="toolbar">
          <button id="resetFoldsBtn" type="button">重置展开状态</button>
          <button id="loadMoreBtn" type="button">加载更多</button>
          <div id="resultSummary" class="resultSummary" aria-live="polite"></div>
        </div>
        <div id="analysisPanel" class="analysisPanel"></div>
        <div id="timeline" class="timeline"></div>
      </section>

      <aside class="detailPane">
        <div id="detail">
          <h2>事件详情</h2>
          <p>点击时间线事件查看原始 JSONL 记录。</p>
        </div>
      </aside>
    </main>

    <script src="/renderers.js"></script>
    <script src="/search-query.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
