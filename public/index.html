<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Session Analyzer</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/vendor/highlightjs/github.min.css">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-mobile-view="sessions">
    <header class="topbar">
      <div class="projectHeader">
        <h1>
          <button id="projectSwitchControl" class="projectSwitchControl" type="button" aria-label="Select target project">
            <span id="projectTitle">Select project</span>
            <span class="projectSwitchHint">Select</span>
          </button>
        </h1>
        <p id="stateLine">正在读取本地 sessions…</p>
      </div>
      <div class="searchbar">
        <div class="searchField">
          <input id="searchInput" type="search" placeholder="Search messages, commands, files, output" autocomplete="off" aria-controls="searchAssist" aria-expanded="false" aria-haspopup="dialog">
          <div class="searchInlineMatches" data-search-match-controls title="Visible matches in rendered content; total is current session, layer, and filters" hidden>
            <span class="searchInlineCount" data-search-match-count>0 / 0</span>
            <button class="searchInlineBtn" type="button" data-search-match-nav="previous" aria-label="Previous search match" title="Previous search match">↑</button>
            <button class="searchInlineBtn" type="button" data-search-match-nav="next" aria-label="Next search match" title="Next search match">↓</button>
          </div>
          <div id="searchAssist" class="searchAssist" role="dialog" aria-label="Search options" hidden>
            <div class="searchAssistSection">
              <div class="searchAssistTitle">Search filters</div>
              <div class="searchAssistControls">
                <label>
                  Kind
                  <select id="searchKindSelect" data-search-operator="kind">
                    <option value="">Any kind</option>
                    <option value="patch">Patch</option>
                    <option value="command">Command</option>
                    <option value="mcp">MCP</option>
                    <option value="web_search">Web search</option>
                    <option value="user_message">User message</option>
                    <option value="assistant_message">Assistant message</option>
                    <option value="plan_artifact">Plan</option>
                    <option value="error">Error</option>
                  </select>
                </label>
                <label>
                  Status
                  <select id="searchStatusSelect" data-search-operator="status">
                    <option value="">Any status</option>
                    <option value="failed">Failed</option>
                    <option value="success">Success</option>
                    <option value="completed">Completed</option>
                  </select>
                </label>
                <label>
                  Layer
                  <select id="searchLayerSelect" data-search-operator="layer">
                    <option value="">Current layer</option>
                    <option value="main">Main timeline</option>
                    <option value="protocol">Protocol layer</option>
                    <option value="raw">Raw records</option>
                  </select>
                </label>
                <label class="fileFilterControl">
                  File
                  <span class="fileSuggestControl">
                    <input id="searchFileInput" data-search-operator="file" placeholder="Any file" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="searchFileSuggestions">
                    <span id="searchFileSuggestions" class="searchFileSuggestions" role="listbox" hidden></span>
                  </span>
                </label>
              </div>
            </div>
            <div class="searchAssistSection">
              <div class="searchAssistTitle">Active</div>
              <div id="searchAssistChips" class="searchAssistChips"></div>
            </div>
          </div>
        </div>
        <select id="layerSelect" aria-label="事件层">
          <option value="main">Main timeline</option>
          <option value="protocol">Protocol layer</option>
          <option value="raw">Raw records</option>
        </select>
        <div class="foldControls">
          <select id="profileSelect" aria-label="折叠策略"></select>
          <button id="resetFoldsBtn" class="ghostBtn" type="button" hidden>重置展开状态</button>
        </div>
      </div>
    </header>

    <nav class="mobileViewTabs" aria-label="Narrow screen sections">
      <button class="mobileViewTab active" type="button" data-mobile-view="sessions">Sessions</button>
      <button class="mobileViewTab" type="button" data-mobile-view="events">Events</button>
      <button class="mobileViewTab" type="button" data-mobile-view="detail">Detail</button>
    </nav>

    <section id="projectChooser" class="projectChooser" hidden>
      <div class="projectChooserHeader">
        <h2>Select target project</h2>
        <p>Choose a Codex session working directory to analyze.</p>
        <div id="projectStatus" class="projectStatus" aria-live="polite"></div>
        <progress id="projectProgress" class="projectProgress" max="100" value="0" hidden></progress>
        <button id="projectCancelBtn" class="ghostBtn projectCancelBtn" type="button" hidden>Cancel indexing</button>
      </div>
      <div id="projectList" class="projectList"></div>
    </section>

    <main class="layout">
      <aside class="sessionsPane">
        <div class="sessionListHeader">
          <h2>Sessions</h2>
          <label class="sortControl">
            <span class="srOnly">排序</span>
            <select id="sortSelect">
              <option value="updated-desc">最近更新</option>
              <option value="started-asc">开始时间</option>
              <option value="events-desc">事件最多</option>
              <option value="failures-desc">失败最多</option>
            </select>
          </label>
        </div>
        <div id="sessionList" class="sessionList"></div>
      </aside>

      <section class="timelinePane">
        <div id="sessionHeader" class="sessionHeader">
          <h2>选择一个 session</h2>
          <p>左侧列表按当前仓库过滤。</p>
        </div>
        <div id="resultSummary" class="resultSummary" aria-live="polite"></div>
        <div id="analysisPanel" class="analysisPanel"></div>
        <div id="timeline" class="timeline"></div>
        <div class="timelineFooter">
          <button id="loadMoreBtn" type="button">加载更多</button>
        </div>
      </section>

      <aside class="detailPane">
        <div id="detail">
          <h2>事件详情</h2>
          <p>点击时间线事件查看原始 JSONL 记录。</p>
        </div>
      </aside>
    </main>

    <div id="dirtyProfileDialog" class="appDialogBackdrop" hidden>
      <section class="appDialog" role="dialog" aria-modal="true" aria-labelledby="dirtyProfileTitle" aria-describedby="dirtyProfileMessage">
        <h2 id="dirtyProfileTitle">折叠策略有未保存修改</h2>
        <p id="dirtyProfileMessage">切换策略前，请选择保存当前修改、放弃修改，或留在当前策略继续编辑。</p>
        <dl class="appDialogMeta">
          <div>
            <dt>当前策略</dt>
            <dd id="dirtyProfileCurrentName">-</dd>
          </div>
        </dl>
        <label class="appDialogField">
          <span>保存为</span>
          <input id="dirtyProfileSaveName" type="text" autocomplete="off">
        </label>
        <div class="appDialogActions">
          <button class="primaryBtn" type="button" data-dirty-profile-choice="save">保存并切换</button>
          <button class="secondaryBtn" type="button" data-dirty-profile-choice="discard">不保存并切换</button>
          <button class="ghostBtn" type="button" data-dirty-profile-choice="cancel">取消</button>
        </div>
      </section>
    </div>

    <script src="/renderers.js"></script>
    <script src="/search-query.js"></script>
    <script src="/highlight.js"></script>
    <script src="/vendor/highlightjs/highlight.min.js"></script>
    <script src="/folding.js"></script>
    <script src="/navigation.js"></script>
    <script src="/event-chips.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
